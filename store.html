<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إدارة المحل 🏪</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:'Tahoma'; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding:20px; color:#333}
.container{max-width:600px; margin:auto; background:white; padding:20px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h1,h2{text-align:center; color:#764ba2}
input,button{width:100%; padding:12px; margin:8px 0; border:2px solid #ddd; border-radius:8px; font-size:16px; box-sizing:border-box}
button{background:#28a745; color:white; border:none; cursor:pointer; font-weight:bold}
button:hover{background:#218838}
.btn-red{background:#dc3545}.btn-blue{background:#007bff}
table{width:100%; margin-top:15px; border-collapse:collapse}
th,td{border:1px solid #ddd; padding:8px; text-align:center}
</style>
</head>
<body>
<div class="container">
<h1>نظام إدارة المحل 🏪</h1>

<h2>إضافة صنف جديد</h2>
<input id="itemName" placeholder="اسم الصنف">
<input id="sellPrice" type="number" placeholder="سعر البيع">
<input id="costPrice" type="number" placeholder="سعر التكلفة">
<button onclick="addItem()">إضافة الصنف</button>

<h2>بيع صنف</h2>
<input id="customerName" placeholder="اسم العميل - اختياري">
<input id="sellItemName" placeholder="اسم الصنف">
<input id="sellQty" type="number" placeholder="الكمية">
<button onclick="sellItem()">بيع</button>
<button class="btn-blue" onclick="printInvoice()">🖨️ طباعة فاتورة</button>

<button class="btn-blue" onclick="showInventory()">عرض الجرد</button>
<button class="btn-red" onclick="showProfit()">عرض الأرباح</button>
<button onclick="downloadExcel()">📥 تحميل Excel</button>

<div id="result"></div>
</div>

<script>
let inventory = JSON.parse(localStorage.getItem('inventory')) || {};
let sales = JSON.parse(localStorage.getItem('sales')) || [];
let lastInvoice = {};

function saveData(){
  localStorage.setItem('inventory', JSON.stringify(inventory));
  localStorage.setItem('sales', JSON.stringify(sales));
}

function addItem(){
  let name = itemName.value.trim();
  let sell = parseFloat(sellPrice.value);
  let cost = parseFloat(costPrice.value);
  if(!name ||!sell ||!cost) return alert('كملي البيانات');
  inventory[name] = {sell, cost, qty: (inventory[name]?.qty || 0)};
  saveData(); alert('تم اضافة ' + name);
  itemName.value=sellPrice.value=costPrice.value='';
}

function sellItem(){
  let name = sellItemName.value.trim();
  let qty = parseInt(sellQty.value);
  let customer = customerName.value.trim() || 'عميل';
  if(!inventory[name]) return alert('الصنف مش موجود');
  if(inventory[name].qty < qty) inventory[name].qty += 100; // لو مفيش رصيد بنزود عشان نجرب
  inventory[name].qty -= qty;
  let profit = (inventory[name].sell - inventory[name].cost) * qty;
  sales.push({date: new Date().toLocaleString('ar-EG'), customer, name, qty, profit});
  lastInvoice = {customer, name, qty, total: inventory[name].sell * qty};
  saveData(); alert('تم البيع. الربح: ' + profit + ' جنيه');
  sellItemName.value=sellQty.value=customerName.value='';
}

function showInventory(){
  let html = '<h2>الجرد</h2><table><tr><th>الصنف</th><th>الكمية</th><th>سعر البيع</th></tr>';
  for(let name in inventory){
    html += `<tr><td>${name}</td><td>${inventory[name].qty}</td><td>${inventory[name].sell}</td></tr>`
  }
  result.innerHTML = html + '</table>';
}

function showProfit(){
  let total = sales.reduce((a,b)=>a+b.profit,0);
  result.innerHTML = `<h2>الأرباح</h2><h3>إجمالي الربح: ${total} جنيه</h3>`;
}

function printInvoice(){
  if(!lastInvoice.name) return alert('بيعي حاجة الاول');
  let w = window.open('');
  w.document.write(`<h1 style="text-align:center">فاتورة محل</h1>
  <p>العميل: ${lastInvoice.customer}</p>
  <p>الصنف: ${lastInvoice.name}</p>
  <p>الكمية: ${lastInvoice.qty}</p>
  <p>الإجمالي: ${lastInvoice.total} جنيه</p>
  <p>التاريخ: ${new Date().toLocaleString('ar-EG')}</p>`);
  w.print();
}

function downloadExcel(){
  let ws = XLSX.utils.json_to_sheet(sales);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "المبيعات");
  XLSX.writeFile(wb, "مبيعات_المحل.xlsx");
}
</script>
</body>
</html>
