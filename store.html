<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المحل</title>
<style>
body{font-family:Arial; background:#f0f0f0; padding:20px; text-align:center}
.container{background:white; padding:20px; border-radius:10px; max-width:600px; margin:auto}
input, button{padding:10px; margin:5px; width:90%; border-radius:5px; border:1px solid #ccc}
button{background:#28a745; color:white; border:none; cursor:pointer; font-weight:bold}
button:hover{background:#218838}
h1{color:#333}
</style>
</head>
<body>
<div class="container">
<h1>🏪 نظام إدارة المحل</h1>
<h3>إضافة صنف جديد</h3>
<input id="itemName" placeholder="اسم الصنف">
<input id="itemPrice" type="number" placeholder="سعر البيع">
<input id="itemCost" type="number" placeholder="سعر التكلفة">
<button onclick="addItem()">إضافة الصنف</button>
<hr>
<h3>بيع صنف</h3>
<input id="sellName" placeholder="اسم الصنف">
<input id="sellQty" type="number" placeholder="الكمية">
<button onclick="sellItem()">بيع</button>
<hr>
<button onclick="showInventory()">عرض الجرد</button>
<button onclick="showProfit()">عرض الأرباح</button>
<div id="result" style="margin-top:20px; text-align:right"></div>
</div>
<script>
let inventory = JSON.parse(localStorage.getItem('inventory')) || {};
let sales = JSON.parse(localStorage.getItem('sales')) || [];
function save(){localStorage.setItem('inventory',JSON.stringify(inventory)); localStorage.setItem('sales',JSON.stringify(sales));}
function addItem(){
 let name=document.getElementById('itemName').value;
 let price=parseFloat(document.getElementById('itemPrice').value);
 let cost=parseFloat(document.getElementById('itemCost').value);
 if(!name||!price||!cost){alert('املي كل البيانات');return;}
 inventory[name]={price:price,cost:cost,qty:0};
 save(); alert('تمت الإضافة');
}
function sellItem(){
 let name=document.getElementById('sellName').value;
 let qty=parseInt(document.getElementById('sellQty').value);
 if(!inventory[name]){alert('الصنف مش موجود');return;}
 inventory[name].qty+=qty;
 sales.push({name:name,qty:qty,price:inventory[name].price,cost:inventory[name].cost,date:new Date().toLocaleString()});
 save(); alert('تم البيع');
}
function showInventory(){
 let html='<h3>الجرد الحالي</h3>';
 for(let name in inventory){html+=`${name}: ${inventory[name].qty} قطعة<br>`;}
 document.getElementById('result').innerHTML=html;
}
function showProfit(){
 let profit=0; let html='<h3>الأرباح</h3>';
 sales.forEach(s=>{profit+=(s.price-s.cost)*s.qty;});
 html+=`إجمالي الربح: ${profit} جنيه`;
 document.getElementById('result').innerHTML=html;
}
</script>
</body>
</html>
